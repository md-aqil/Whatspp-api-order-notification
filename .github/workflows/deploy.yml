name: Remote Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST || '187.127.154.55' }}
          username: ${{ secrets.SSH_USER || 'aqil' }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script: |
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S chown -R aqil:aqil /var/www/lcsw 2>/dev/null || true
            cd /var/www/lcsw
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/deploy.sh
            export SUDO_PASS="${{ secrets.SSH_PASSWORD }}"
            ./deploy/deploy.sh

